dependencies {
    implementation 'com.devexpress:devexpress-docs-pdf:26.2.2'
}

application {
    mainClass = 'com.devexpress.demos.PdfDigitalSignature'
}

processResources {
    from("$rootDir/SharedFiles/PDF/Sample_Alternative.pdf") { into('SharedFiles/PDF') }
    from("$rootDir/SharedFiles/PDF/Sample_Certificate.pfx") { into('SharedFiles/PDF') }
    from("$rootDir/SharedFiles/DevExpress.png") { into('SharedFiles') }
}
